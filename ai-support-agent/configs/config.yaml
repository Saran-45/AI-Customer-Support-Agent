# Central configuration for the AI support agent project.
# NOTE: brand, dataset size, and dates below describe the SYNTHETIC
# demo corpus generated by scripts/download_data.py in this sandbox
# (see DECISION_LOG.md, Decision 1). Point `data_source` at a real
# extract of thoughtvector/customer-support-on-twitter to run against
# real data -- no code changes required downstream of build_threads.py.

project:
  name: ai-support-agent
  random_seed: 42

data:
  source: synthetic_v1          # synthetic_v1 | kaggle_twcs
  brand: StreamBoxHelp          # fictional brand, synthetic corpus only
  raw_path: data/raw/twcs.csv
  processed_dir: data/processed
  golden_dir: data/golden
  # temporal split boundaries (as fraction of chronologically sorted conversations)
  split:
    train_frac: 0.70
    val_frac: 0.15
    golden_frac: 0.15

intent:
  taxonomy_path: data/golden/intent_taxonomy.yaml
  classifier: tfidf_logreg      # tfidf_logreg | llm_fewshot (requires ANTHROPIC_API_KEY)
  min_confidence: 0.35

retrieval:
  backend: tfidf                # tfidf (always available) | sentence_transformers (requires model download)
  top_k: 5
  min_similarity: 0.15

generation:
  backend: template_grounded     # template_grounded (no API needed) | llm (requires ANTHROPIC_API_KEY)
  max_reply_tokens: 120

escalation:
  low_confidence_intent_threshold: 0.45
  low_similarity_threshold: 0.20
  sensitive_intents:
    - account_security
    - billing_overcharge
    - refund_request
  keyword_triggers:
    - fraud
    - hacked
    - lawsuit
    - lawyer
    - suicide
    - self harm
    - unauthorized charge
    - data breach

evaluation:
  golden_set_size_target: 200
  quick_mode_sample_size: 40
  llm_judge_backend: rule_based   # rule_based (no API) | llm (requires ANTHROPIC_API_KEY)
